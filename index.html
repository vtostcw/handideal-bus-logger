<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bus Sensor Logger</title>
<style>
  :root {
    --bg:      #ffffff; --surface: #f5f5f5; --surface2: #ebebeb;
    --border:  #d0d0d0; --text: #111111; --muted: #666666;
    --accent:  #1a56db; --ok: #1a7f4b; --danger: #c0392b;
    --c-accel: #1a56db; --c-brake: #c0392b; --c-turn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
      --border: #333333; --text: #f0f0f0; --muted: #888888;
      --accent: #4d8cf5; --ok: #34d27a; --danger: #e05c4b;
      --c-accel: #4d8cf5; --c-brake: #e05c4b; --c-turn: #f59e0b;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background .3s; }
  .rec-dot.on { background: var(--danger); animation: blink 1.1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); transition: all .25s; }
  .badge.on { background: transparent; border-color: var(--ok); color: var(--ok); font-weight: 500; }
  main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; max-width: 680px; width: 100%; margin: 0 auto; }
  .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 13px; }
  .metric-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .metric-row { display: flex; justify-content: space-between; font-size: 12px; font-family: ui-monospace, monospace; color: var(--text); margin-bottom: 2px; }
  .metric-axis { color: var(--muted); }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; padding: 13px 10px; border-radius: 10px; cursor: pointer; transition: opacity .15s, border-color .15s; display: flex; align-items: center; justify-content: center; gap: 7px; -webkit-tap-highlight-color: transparent; user-select: none; }
  .btn:active:not(:disabled) { opacity: .7; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-start { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .btn-stop.on { border-color: var(--danger); color: var(--danger); }
  .btn-send { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; font-size: 15px; padding: 15px; border-radius: 10px; }
  .btn-event { flex-direction: column; gap: 5px; padding: 18px 8px; border-radius: 12px; }
  .btn-event .evt-label { font-size: 13px; font-weight: 600; }
  .btn-event .evt-count { font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); }
  .btn-accel { border-color: var(--c-accel); color: var(--c-accel); }
  .btn-brake  { border-color: var(--c-brake);  color: var(--c-brake); }
  .btn-turn   { border-color: var(--c-turn);   color: var(--c-turn); }
  .flash { animation: flashAnim .22s ease; }
  @keyframes flashAnim { 0%,100%{opacity:1} 50%{opacity:.35} }
  .counter-strip { display: flex; gap: 18px; font-size: 12px; font-family: ui-monospace, monospace; color: var(--muted); }
  .counter-strip b { color: var(--text); }
  .btn-sm { font-size: 13px; padding: 11px 10px; border-radius: 8px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header h3 { font-size: 13px; font-weight: 600; }
  .panel-count { font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); background: var(--surface2); padding: 2px 8px; border-radius: 5px; }
  .table-wrap { overflow-x: auto; max-height: 220px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: ui-monospace, monospace; }
  th { position: sticky; top: 0; z-index: 1; background: var(--surface2); color: var(--muted); font-weight: 500; padding: 7px 11px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:first-child { text-align: left; }
  td { padding: 6px 11px; text-align: right; color: var(--text); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td:first-child { text-align: left; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .c-accel { color: var(--c-accel); font-weight: 600; }
  .c-brake  { color: var(--c-brake); font-weight: 600; }
  .c-turn   { color: var(--c-turn);  font-weight: 600; }
  .empty { padding: 28px 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .diag-log { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); padding: 10px 14px; max-height: 110px; overflow-y: auto; line-height: 1.8; }
  .field-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  .field-input { width: 100%; padding: 10px 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border-color .2s; margin-bottom: 10px; }
  .field-input:focus { border-color: var(--accent); }
  .field-input:disabled { opacity: .5; cursor: not-allowed; }
  .field-error { font-size: 11px; color: var(--danger); margin-top: -6px; margin-bottom: 8px; display: none; }
  .send-status { font-size: 13px; margin-top: 10px; padding: 10px 14px; border-radius: 8px; display: none; font-family: ui-monospace, monospace; text-align: center; }
  .send-status.ok      { border: 1px solid var(--ok);    color: var(--ok); }
  .send-status.err     { border: 1px solid var(--danger); color: var(--danger); }
  .send-status.loading { border: 1px solid var(--border); color: var(--muted); }
  .choice-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .choice-btn { border: 1.5px solid var(--border); background: var(--surface2); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 500; padding: 12px 6px; border-radius: 10px; cursor: pointer; line-height: 1.25; -webkit-tap-highlight-color: transparent; user-select: none; transition: background .15s, border-color .15s, color .15s; }
  .choice-btn:active { opacity: .7; }
  .choice-btn.selected { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .choice-group.invalid .choice-btn:not(.selected) { border-color: var(--danger); }
  .prefilled-badge { display: inline-block; font-size: 11px; background: rgba(26,86,219,.1); color: var(--accent); border: 1px solid rgba(26,86,219,.3); border-radius: 5px; padding: 2px 8px; margin-left: 8px; font-weight: 500; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

  <div class="logo"><div class="rec-dot" id="recDot"></div>Bus Sensor Logger</div>
  <div class="badge" id="statusBadge">En attente</div>
</header>
<main>

  <!-- Contrôles -->
  <div>

    <div class="row2">
      <button class="btn btn-start" id="btnStart" onclick="startRecording()">Démarrer</button>

  <!-- Signalements -->
  <div>

</main>
<script>
const SUPA_URL  = 'https://psmunhhgwpwcsnjixnqn.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbXVuaGhnd3B3Y3Nuaml4bnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNjcwMDgsImV4cCI6MjEwMzc0MzAwOH0.wPJW03N5_WRfOA_vzitzqPYGIlJalDFZUAnjvmMdL-Q';

// ── Paramètres URL ────────────────────────────────────────────────────────────
function getURLParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

window.addEventListener('load', () => {
  const pParam = getURLParam('participant');
  if (pParam) {
    const input = document.getElementById('participantId');
    input.value = pParam;
    input.disabled = true;
    input.style.opacity = '.6';
    document.getElementById('prefilledBadge').style.display = 'inline-block';
  }
});

// ── État ──────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtV = v => (v !== null && v !== undefined) ? Number(v).toFixed(4) : null;
function diag(msg) { console.log(new Date().toLocaleTimeString('fr') + '  ' + msg); }

let isRecording = false, startTime = null, acqInterval = null, gpsWatchId = null;
let sessionId = null; // identifiant unique par enregistrement (lie acquisitions et signalements)
let accSensor = null, gyrSensor = null, linSensor = null;
let usingGenAcc = false, usingGenGyr = false, hasLin = false;
let lastAcc   = {x:null,y:null,z:null}; // avec gravité
let lastAccNG = {x:null,y:null,z:null}; // sans gravité
let lastGyr   = {x:null,y:null,z:null};
let lastGPS   = {lat:null,lon:null,alt:null};
let acquisitions = [], events = [];
let counts = {'Accélération':0,'Freinage':0,'Virage':0};

// Estimation de la gravité par filtre passe-bas (uniquement si aucun capteur
// d'accélération linéaire n'est disponible). Constante de temps longue (5 s)
// pour ne pas absorber les freinages et virages dans la "gravité".
const G_TAU = 5;
let gravityEst = null, gravityTs = null;
function updateNG(ax, ay, az) {
  const now = performance.now();
  if (gravityEst === null) { gravityEst = {x:ax,y:ay,z:az}; gravityTs = now; }
  const dt = Math.max(0.001, (now - gravityTs) / 1000); gravityTs = now;
  const k = Math.exp(-dt / G_TAU);
  gravityEst.x = k*gravityEst.x + (1-k)*ax;
  gravityEst.y = k*gravityEst.y + (1-k)*ay;
  gravityEst.z = k*gravityEst.z + (1-k)*az;
  lastAccNG.x = ax - gravityEst.x; lastAccNG.y = ay - gravityEst.y; lastAccNG.z = az - gravityEst.z;
}

// ── Capteurs ──────────────────────────────────────────────────────────────────
async function startSensors() {
  gravityEst = null; usingGenAcc = false; usingGenGyr = false; hasLin = false;

  // Accélération linéaire (sans gravité) fournie par le système, en priorité
  if (window.LinearAccelerationSensor) {
    try {
      linSensor = new LinearAccelerationSensor({frequency:20});
      linSensor.addEventListener('reading', () => { lastAccNG.x=linSensor.x; lastAccNG.y=linSensor.y; lastAccNG.z=linSensor.z; });
      linSensor.addEventListener('error', e => { hasLin = false; diag('LinearAcc erreur : ' + e.error.message); });
      linSensor.start(); hasLin = true; diag('LinearAccelerationSensor actif');
    } catch(e) { linSensor = null; hasLin = false; diag('LinearAcc indisponible : ' + e.message); }
  }

  // Accéléromètre (avec gravité)
  if (window.Accelerometer) {
    try {
      accSensor = new Accelerometer({frequency:20});
      accSensor.addEventListener('reading', () => {
        lastAcc.x=accSensor.x; lastAcc.y=accSensor.y; lastAcc.z=accSensor.z;
        if (!hasLin) updateNG(accSensor.x, accSensor.y, accSensor.z);
      });
      accSensor.addEventListener('error', e => diag('Acc erreur : ' + e.error.message));
      accSensor.start(); usingGenAcc = true; diag('Accelerometre actif');
    } catch(e) { diag('Accelerometre indisponible, bascule DeviceMotion'); }
  }

  // Gyroscope (rad/s -> deg/s)
  if (window.Gyroscope) {
    try {
      gyrSensor = new Gyroscope({frequency:20});
      gyrSensor.addEventListener('reading', () => {
        lastGyr.x=gyrSensor.x*(180/Math.PI); lastGyr.y=gyrSensor.y*(180/Math.PI); lastGyr.z=gyrSensor.z*(180/Math.PI);
      });
      gyrSensor.addEventListener('error', e => diag('Gyr erreur : ' + e.error.message));
      gyrSensor.start(); usingGenGyr = true; diag('Gyroscope actif');
    } catch(e) { diag('Gyroscope indisponible'); }
  }

  if (!usingGenAcc || !usingGenGyr) attachDeviceMotion();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        onGPS(pos); diag('GPS OK');
        gpsWatchId = navigator.geolocation.watchPosition(onGPS, e => diag('GPS erreur : ' + e.message), {enableHighAccuracy:true, maximumAge:0, timeout:15000});
      },
      e => diag('GPS refuse : ' + e.message),
      {enableHighAccuracy:true, timeout:15000}
    );
  } else diag('Geolocalisation non disponible');
}

function attachDeviceMotion() {
  const attach = () => { window.addEventListener('devicemotion', onDeviceMotion, {passive:true}); diag('DeviceMotion actif'); };
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') attach(); else diag('Permission DeviceMotion refusee'); }).catch(e => diag('DeviceMotion erreur : ' + e.message));
  } else attach();
}

function onDeviceMotion(e) {
  if (!usingGenAcc) {
    const a = e.accelerationIncludingGravity;
    if (a && a.x !== null) {
      lastAcc.x=a.x; lastAcc.y=a.y; lastAcc.z=a.z;
      const lin = e.acceleration;
      if (lin && lin.x !== null) { lastAccNG.x=lin.x; lastAccNG.y=lin.y; lastAccNG.z=lin.z; }
      else updateNG(a.x, a.y, a.z);
    }
  }
  if (!usingGenGyr) {
    const r = e.rotationRate; // alpha = axe z, beta = axe x, gamma = axe y
    if (r && r.alpha !== null) { lastGyr.x=r.beta; lastGyr.y=r.gamma; lastGyr.z=r.alpha; }
  }
}

function onGPS(pos) { lastGPS.lat=pos.coords.latitude; lastGPS.lon=pos.coords.longitude; lastGPS.alt=pos.coords.altitude; }

function stopSensors() {
  window.removeEventListener('devicemotion', onDeviceMotion);
  [accSensor, gyrSensor, linSensor].forEach(s => { if (s) { try { s.stop(); } catch(_) {} } });
  accSensor = null; gyrSensor = null; linSensor = null;
  if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  usingGenAcc = false; usingGenGyr = false; hasLin = false;
}

// ── Enregistrement ────────────────────────────────────────────────────────────
function snapshot() {
  return {
    accX:fmtV(lastAcc.x), accY:fmtV(lastAcc.y), accZ:fmtV(lastAcc.z),
    accXng:fmtV(lastAccNG.x), accYng:fmtV(lastAccNG.y), accZng:fmtV(lastAccNG.z),
    gyrX:fmtV(lastGyr.x), gyrY:fmtV(lastGyr.y), gyrZ:fmtV(lastGyr.z),
    lat:fmtV(lastGPS.lat), lon:fmtV(lastGPS.lon), alt:fmtV(lastGPS.alt)
  };
}

async function startRecording() {
  $('btnStart').disabled = true;
  acquisitions = []; events = [];
  counts = {'Accélération':0,'Freinage':0,'Virage':0};
  ['cntAccel','cntBrake','cntTurn','totalEvt'].forEach(id => { $(id).textContent = '0'; });
  $('btnSend').disabled = true;
  $('sendStatus').style.display = 'none';
  resetConditions();
  sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  diag('Demarrage des capteurs...');
  await startSensors();
  await sleep(600);

  startTime = performance.now(); isRecording = true;
  acqInterval = setInterval(() => {
    if (!isRecording || lastAcc.x === null) return;
    acquisitions.push(Object.assign({t: ((performance.now() - startTime) / 1000).toFixed(3)}, snapshot()));
  }, 50);

  $('btnStop').disabled = false; $('btnStop').classList.add('on');
  ['btnAccel','btnBrake','btnTurn'].forEach(id => { $(id).disabled = false; });
  $('recDot').classList.add('on');
  $('statusBadge').textContent = 'Enregistrement'; $('statusBadge').classList.add('on');
}

function stopRecording() {
  isRecording = false; clearInterval(acqInterval); stopSensors();
  diag('Arret - ' + acquisitions.length + ' echantillons, ' + events.length + ' signalements');
  $('btnStart').disabled = false;
  $('btnStop').disabled = true; $('btnStop').classList.remove('on');
  ['btnAccel','btnBrake','btnTurn'].forEach(id => { $(id).disabled = true; });
  $('recDot').classList.remove('on');
  $('statusBadge').textContent = 'Arrete'; $('statusBadge').classList.remove('on');
  $('btnSend').disabled = acquisitions.length === 0 && events.length === 0;
}

function logEvent(type) {
  if (!isRecording) return;
  const t = ((performance.now() - startTime) / 1000).toFixed(3);
  events.push(Object.assign({t, type}, snapshot()));
  counts[type]++;
  $('totalEvt').textContent = events.length;
  const idMap  = {'Accélération':'cntAccel','Freinage':'cntBrake','Virage':'cntTurn'};
  const btnMap = {'Accélération':'btnAccel','Freinage':'btnBrake','Virage':'btnTurn'};
  $(idMap[type]).textContent = counts[type];
  const btn = $(btnMap[type]); btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 250);
  diag('Signalement : ' + type + ' a t=' + t + 's');
}

// ── CSV ───────────────────────────────────────────────────────────────────────
function toCSV(headers, rows) {
  const esc = v => { if (v === null || v === undefined) return ''; const s = String(v); return s.includes(',') || s.includes('"') ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return [headers.join(','), ...rows.map(r => r.map(esc).join(','))].join('\r\n');
}
function buildCSV(type) {
  // Les colonnes Affluence / Meteo / Trafic sont toujours EN FIN de ligne :
  // les positions des colonnes existantes ne changent pas.
  const cond = [conditions.affluence, conditions.meteo, conditions.trafic];
  if (type === 'acquisition') return toCSV(
    ['Temps_s','AccX_ms2','AccY_ms2','AccZ_ms2','AccX_ng','AccY_ng','AccZ_ng','GyrX_degs','GyrY_degs','GyrZ_degs','Lat','Lon','Alt_m','Affluence','Meteo','Trafic'],
    acquisitions.map(r => [r.t,r.accX,r.accY,r.accZ,r.accXng,r.accYng,r.accZng,r.gyrX,r.gyrY,r.gyrZ,r.lat,r.lon,r.alt,...cond]));
  return toCSV(
    ['Temps_s','Type','AccX_ms2','AccY_ms2','AccZ_ms2','AccX_ng','AccY_ng','AccZ_ng','GyrX_degs','GyrY_degs','GyrZ_degs','Lat','Lon','Alt_m','Affluence','Meteo','Trafic'],
    events.map(r => [r.t,r.type,r.accX,r.accY,r.accZ,r.accXng,r.accYng,r.accZng,r.gyrX,r.gyrY,r.gyrZ,r.lat,r.lon,r.alt,...cond]));
}
function ts() { const d = new Date(); return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0') + String(d.getSeconds()).padStart(2,'0'); }

// ── Envoi Supabase ────────────────────────────────────────────────────────────
async function uploadToSupabase(type, participant, ligne) {
  const csv = buildCSV(type);
  const filename = (type === 'acquisition' ? 'acquisitions_' : 'signalements_') + participant + '_' + ts() + '.csv';
  const res = await fetch(SUPA_URL + '/rest/v1/resultats', {
    method: 'POST',
    headers: {'Authorization':'Bearer '+SUPA_ANON, 'apikey':SUPA_ANON, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
    body: JSON.stringify({type, filename, contenu:csv, participant, ligne, session_id:sessionId, affluence:conditions.affluence, meteo:conditions.meteo, trafic:conditions.trafic})
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(filename + ' : ' + (err.message || err.hint || err.error || 'HTTP ' + res.status)); }
  return filename;
}

async function sendResults() {
  const status = $('sendStatus'), btn = $('btnSend');
  const partInput = $('participantId'), ligneSelect = $('ligneSelect');
  const participant = partInput.value.trim(), ligne = ligneSelect.value;

  let ok = true;
  if (!participant) { $('errParticipant').style.display='block'; partInput.style.borderColor='var(--danger)'; ok=false; } else { $('errParticipant').style.display='none'; partInput.style.borderColor=''; }
  if (!ligne) { $('errLigne').style.display='block'; ligneSelect.style.borderColor='var(--danger)'; ok=false; } else { $('errLigne').style.display='none'; ligneSelect.style.borderColor=''; }
  [['affluence','grpAffluence','errAffluence'],['meteo','grpMeteo','errMeteo'],['trafic','grpTrafic','errTrafic']].forEach(([k,g,e]) => {
    if (!conditions[k]) { $(e).style.display='block'; $(g).classList.add('invalid'); ok=false; }
  });
  if (!ok) {
    const firstErr = Array.from(document.querySelectorAll('.field-error')).find(el => el.style.display === 'block');
    if (firstErr && firstErr.scrollIntoView) firstErr.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  btn.disabled = true;
  status.className = 'send-status loading'; status.textContent = 'Envoi en cours (1/2)...'; status.style.display = 'block';
  try {
    await uploadToSupabase('acquisition', participant, ligne);
    status.textContent = 'Envoi en cours (2/2)...';
    await uploadToSupabase('events', participant, ligne);
    status.className = 'send-status ok';
    status.textContent = 'Resultats envoyes - Participant : ' + participant + ' - Ligne : ' + ligne;
    diag('Envoi OK');
  } catch(e) {
    status.className = 'send-status err'; status.textContent = 'Erreur : ' + e.message;
    diag('Erreur envoi : ' + e.message); btn.disabled = false;
  }
}

// ── Conditions du trajet (boutons de choix) ───────────────────────────────────
const conditions = { affluence:null, meteo:null, trafic:null };

function selectChoice(group, btn) {
  const key = group.dataset.key;
  group.querySelectorAll('.choice-btn').forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-checked','false'); });
  btn.classList.add('selected'); btn.setAttribute('aria-checked','true');
  conditions[key] = btn.dataset.value;
  group.classList.remove('invalid');
  document.getElementById('err' + key.charAt(0).toUpperCase() + key.slice(1)).style.display = 'none';
}

function resetConditions() {
  Object.keys(conditions).forEach(k => { conditions[k] = null; });
  document.querySelectorAll('.choice-group').forEach(g => {
    g.classList.remove('invalid');
    g.querySelectorAll('.choice-btn').forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-checked','false'); });
  });
  ['errAffluence','errMeteo','errTrafic'].forEach(id => { document.getElementById(id).style.display = 'none'; });
}

document.querySelectorAll('.choice-group').forEach(g => {
  g.querySelectorAll('.choice-btn').forEach(b => b.addEventListener('click', () => selectChoice(g, b)));
});
</script>
