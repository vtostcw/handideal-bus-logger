<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Logger — Administration</title>
<style>
  :root { --bg:#ffffff;--surface:#f5f5f5;--surface2:#ebebeb;--border:#d0d0d0;--text:#111111;--muted:#666666;--accent:#1a56db;--ok:#1a7f4b;--danger:#c0392b; }
  @media(prefers-color-scheme:dark){:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;--border:#333333;--text:#f0f0f0;--muted:#888888;--accent:#4d8cf5;--ok:#34d27a;--danger:#e05c4b;}}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;font-size:15px;}
  header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:15px;font-weight:600;} .logo span{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px;}
  main{flex:1;padding:24px;max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .panel-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .panel-header h2{font-size:14px;font-weight:600;}
  .panel-body{padding:16px 18px;}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;}
  .btn-sm{font-size:12px;padding:6px 11px;border-radius:6px;}
  .stats-row{display:flex;gap:12px;flex-wrap:wrap;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:140px;}
  .stat-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  .stat-value{font-size:24px;font-weight:600;}
  input[type=text],select{padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
  input[type=text]:focus,select:focus{border-color:var(--accent);}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--surface2);color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1;}
  td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface2);}
  .badge-type{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;}
  .badge-acq{background:rgba(26,86,219,.12);color:var(--accent);}
  .badge-evt{background:rgba(26,127,75,.12);color:var(--ok);}
  .empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;}
  .loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:var(--muted);font-size:14px;}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-bar{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;}
  .link-box{font-family:ui-monospace,monospace;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;word-break:break-all;color:var(--accent);}
  .gen-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;flex-wrap:wrap;}
  .field-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
  ::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<header>
  <div class="logo">Bus Sensor Logger <span>Administration</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="status-bar" id="statusBar">—</span>
    <button class="btn" onclick="loadData()">Actualiser</button>
    <a href="analyse.html" class="btn">Analyse</a>
  </div>
</header>
<main>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Participants</div><div class="stat-value" id="statParticipants">—</div></div>
    <div class="stat-card"><div class="stat-label">Envois totaux</div><div class="stat-value" id="statEnvois">—</div></div>
    <div class="stat-card"><div class="stat-label">Acquisitions</div><div class="stat-value" id="statAcq">—</div></div>
    <div class="stat-card"><div class="stat-label">Signalements</div><div class="stat-value" id="statEvt">—</div></div>
  </div>

  <!-- Générateur de liens -->
  <div class="panel">
    <div class="panel-header"><h2>Générer un lien participant</h2></div>
    <div class="panel-body">
      <div class="gen-row" style="margin-bottom:12px;">
        <div>
          <label class="field-label">Numéro de participant</label>
          <input type="text" id="genParticipant" placeholder="Ex : P01" style="width:100%;"/>
        </div>
        <div></div>
        <button class="btn btn-primary" onclick="generateLink()">Générer le lien</button>
      </div>
      <div id="generatedLink" style="display:none;">
        <div class="field-label" style="margin-bottom:6px;">Lien à envoyer au participant</div>
        <div class="link-box" id="linkBox"></div>
        <button class="btn btn-sm" style="margin-top:8px;" onclick="copyLink()">Copier le lien</button>
      </div>
    </div>
  </div>

  <!-- Résultats -->
  <div class="panel">
    <div class="panel-header">
      <h2>Résultats</h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="searchInput" placeholder="Filtrer par participant..." oninput="filterTable()" style="width:200px;"/>
        <select id="typeFilter" onchange="filterTable()">
          <option value="">Tous les types</option>
          <option value="acquisition">Acquisitions</option>
          <option value="events">Signalements</option>
        </select>
        <button class="btn btn-ok" id="btnDlAll" onclick="downloadAll()" disabled>Tout télécharger</button>
      </div>
    </div>
    <div id="tableContainer"><div class="loading"><div class="spinner"></div> Chargement…</div></div>
  </div>

</main>
<script>
const SUPA_URL  = 'https://psmunhhgwpwcsnjixnqn.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzbXVuaGhnd3B3Y3Nuaml4bnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNjcwMDgsImV4cCI6MjEwMzc0MzAwOH0.wPJW03N5_WRfOA_vzitzqPYGIlJalDFZUAnjvmMdL-Q';
const BASE_URL  = 'https://vtostcw.github.io/handideal-bus-logger/';

let allRows = [], filteredRows = [];

async function loadData() {
  document.getElementById('tableContainer').innerHTML='<div class="loading"><div class="spinner"></div> Chargement…</div>';
  document.getElementById('statusBar').textContent='Chargement…';
  document.getElementById('btnDlAll').disabled=true;
  try {
    const res=await fetch(SUPA_URL+'/rest/v1/resultats?select=id,created_at,participant,type,filename,ligne&order=created_at.desc',
      {headers:{'Authorization':'Bearer '+SUPA_ANON,'apikey':SUPA_ANON}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    allRows=await res.json();
    updateStats(); filterTable();
    document.getElementById('statusBar').textContent='Mis à jour : '+new Date().toLocaleTimeString('fr');
    document.getElementById('btnDlAll').disabled=allRows.length===0;
  } catch(e) {
    document.getElementById('tableContainer').innerHTML='<div class="empty">Erreur : '+e.message+'</div>';
    document.getElementById('statusBar').textContent='Erreur';
  }
}

function updateStats() {
  const parts=new Set(allRows.map(r=>r.participant)).size;
  document.getElementById('statParticipants').textContent=parts;
  document.getElementById('statEnvois').textContent=allRows.length;
  document.getElementById('statAcq').textContent=allRows.filter(r=>r.type==='acquisition').length;
  document.getElementById('statEvt').textContent=allRows.filter(r=>r.type==='events').length;
}

function filterTable() {
  const search=document.getElementById('searchInput').value.trim().toLowerCase();
  const type=document.getElementById('typeFilter').value;
  filteredRows=allRows.filter(r=>(!search||(r.participant&&r.participant.toLowerCase().includes(search)))&&(!type||r.type===type));
  renderTable();
}

function renderTable() {
  if(filteredRows.length===0){document.getElementById('tableContainer').innerHTML='<div class="empty">Aucun résultat.</div>';return;}
  const rows=filteredRows.map(r=>{
    const date=new Date(r.created_at).toLocaleString('fr-FR');
    const badgeCls=r.type==='acquisition'?'badge-acq':'badge-evt';
    const badgeTxt=r.type==='acquisition'?'Acquisition':'Signalements';
    return `<tr>
      <td>${r.participant||'—'}</td>
      <td>${r.ligne||'—'}</td>
      <td>${date}</td>
      <td><span class="badge-type ${badgeCls}">${badgeTxt}</span></td>
      <td style="color:var(--muted);font-family:ui-monospace,monospace;font-size:12px;">${r.filename}</td>
      <td><button class="btn btn-sm btn-primary" onclick="downloadOne('${r.id}','${r.filename}')">Télécharger</button></td>
    </tr>`;
  }).join('');
  document.getElementById('tableContainer').innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>Participant</th><th>Ligne</th><th>Date</th><th>Type</th><th>Fichier</th><th>Action</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

async function downloadOne(id,filename) {
  try {
    const res=await fetch(SUPA_URL+'/rest/v1/resultats?id=eq.'+id+'&select=contenu,filename',{headers:{'Authorization':'Bearer '+SUPA_ANON,'apikey':SUPA_ANON}});
    const data=await res.json();
    if(!data||data.length===0) throw new Error('Données introuvables');
    triggerDownload(data[0].contenu,data[0].filename);
  } catch(e){alert('Erreur : '+e.message);}
}

async function downloadAll() {
  document.getElementById('btnDlAll').disabled=true;
  document.getElementById('statusBar').textContent='Téléchargement…';
  try {
    const res=await fetch(SUPA_URL+'/rest/v1/resultats?select=contenu,filename,participant,type&order=participant.asc,created_at.asc',{headers:{'Authorization':'Bearer '+SUPA_ANON,'apikey':SUPA_ANON}});
    const data=await res.json();
    for(let i=0;i<data.length;i++){
      await new Promise(r=>setTimeout(r,300));
      triggerDownload(data[i].contenu,data[i].filename);
      document.getElementById('statusBar').textContent='Téléchargement '+(i+1)+'/'+data.length+'…';
    }
    document.getElementById('statusBar').textContent=data.length+' fichiers téléchargés';
  } catch(e){alert('Erreur : '+e.message);}
  document.getElementById('btnDlAll').disabled=false;
}

function triggerDownload(csvContent,filename) {
  const blob=new Blob(['\uFEFF'+csvContent],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:filename});
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── Générateur de liens ───────────────────────────────────────────────────────
function generateLink() {
  const participant=document.getElementById('genParticipant').value.trim();
  if(!participant){alert('Saisissez un numéro de participant.');return;}
  const url=BASE_URL+'?participant='+encodeURIComponent(participant);
  document.getElementById('linkBox').textContent=url;
  document.getElementById('generatedLink').style.display='block';
}

function copyLink() {
  const url=document.getElementById('linkBox').textContent;
  navigator.clipboard.writeText(url).then(()=>alert('Lien copié !')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=url;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); alert('Lien copié !');
  });
}

loadData();
</script>
</body>
</html>
